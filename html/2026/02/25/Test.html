<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Radial Card Menu - Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        :root {
            --bg-color: #09090b;
            /* 회전 반경을 줄여서 좀 더 둥글고 타이트한 부채꼴 생성 */
            --menu-radius: 320px; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 100%, #3b076444 0%, var(--bg-color) 60%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .menu-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 250px; 
            display: flex;
            justify-content: center;
            touch-action: none;
            z-index: 100;
        }

        /* 회전 중심축: 반경이 줄어든 만큼 위치 조정 */
        .wheel {
            position: absolute;
            bottom: -200px; 
            left: 50%;
            width: 0;
            height: 0;
            transform: rotate(var(--global-angle, 0deg));
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 개별 카드 (크기 대폭 확대) */
        .card {
            position: absolute;
            width: 120px;  /* 100px -> 120px */
            height: 180px; /* 150px -> 180px */
            left: -60px;   /* 너비의 절반 */
            top: -90px;    /* 높이의 절반 */
            
            transform: rotate(var(--angle)) 
                       translateY(calc(-1 * var(--menu-radius))) 
                       translateY(var(--offset-y, 0));
                       
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 26px;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            
            /* z-index는 JS에서 실시간으로 부여되므로 트랜지션에서 제외 */
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.4s ease, 
                        box-shadow 0.4s ease;
            
            box-shadow: -10px 0 25px rgba(0, 0, 0, 0.5),
                        0 10px 30px rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.5);
        }

        /* 호버 시 살짝 위로 올라오는 효과 */
        .card:hover:not(.focused) {
            --offset-y: -15px;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.8);
        }

        /* 화려한 그라디언트를 위한 가상 요소 */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, var(--c1), var(--c2));
            opacity: 0; 
            transition: opacity 0.4s ease; 
            z-index: 0;
        }

        .card svg, .card .label {
            position: relative;
            z-index: 2;
        }

        /* ★ 포커스(선택) 상태: 카드의 50%(90px) 팝업 */
        .card.focused {
            --offset-y: -90px; 
            border-color: rgba(255,255,255,0.5);
            color: #ffffff;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 
                        0 15px 35px var(--c1-glow);
        }

        .card.focused::before {
            opacity: 1;
        }

        .card svg {
            width: 42px; /* 아이콘 크기 키움 */
            height: 42px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card .label {
            position: absolute;
            bottom: 25px;
            font-size: 15px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .card.focused svg {
            transform: translateY(-16px) scale(1.15);
        }

        .card.focused .label {
            opacity: 1;
            transform: translateY(0);
        }

        .glow-indicator {
            position: absolute;
            bottom: -30px;
            width: 250px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            filter: blur(45px);
            border-radius: 50%;
            pointer-events: none;
            transition: background 0.5s ease;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="glow-indicator" id="indicator"></div>

    <div class="menu-container" id="menu-container">
        <div class="wheel" id="wheel">
            <!-- Cards -->
            <div class="card" style="--c1: #ec4899; --c2: #8b5cf6; --c1-glow: rgba(236,72,153,0.5);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span class="label">Home</span>
            </div>
            
            <div class="card" style="--c1: #f43f5e; --c2: #f97316; --c1-glow: rgba(244,63,94,0.5);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span class="label">Search</span>
            </div>
            
            <div class="card" style="--c1: #8b5cf6; --c2: #3b82f6; --c1-glow: rgba(139,92,246,0.5);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span class="label">Chat</span>
            </div>
            
            <div class="card focused" style="--c1: #10b981; --c2: #14b8a6; --c1-glow: rgba(16,185,129,0.5);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span class="label">Alerts</span>
            </div>
            
            <div class="card" style="--c1: #0ea5e9; --c2: #6366f1; --c1-glow: rgba(14,165,233,0.5);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span class="label">Profile</span>
            </div>

            <div class="card" style="--c1: #eab308; --c2: #f59e0b; --c1-glow: rgba(234,179,8,0.5);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span class="label">Settings</span>
            </div>

            <div class="card" style="--c1: #d946ef; --c2: #db2777; --c1-glow: rgba(217,70,239,0.5);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                <span class="label">Favorites</span>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('menu-container');
        const wheel = document.getElementById('wheel');
        const cards = document.querySelectorAll('.card');
        const indicator = document.getElementById('indicator');
        
        // 반경이 줄고 카드가 커졌으므로 각도를 약간 넓혀 자연스러운 겹침 유도
        const angleStep = 15; 
        const startOffset = -((cards.length - 1) * angleStep) / 2;
        
        let currentAngle = 0;
        let isDragging = false;
        let startX = 0;
        let startAngle = 0;
        let dragDistance = 0;

        // 드래그 중 실시간으로 가장 가까운 카드를 찾고,
        // 거리에 따라 Z-index를 동적으로 부여하여 중앙 카드가 항상 맨 위에 오도록 함
        const updateFocusDuringDrag = () => {
            let closestCard = null;
            let minDiff = Infinity;

            cards.forEach(card => {
                const cardAngle = parseFloat(card.dataset.angle);
                const diff = Math.abs(cardAngle - (-currentAngle));
                
                // ★ 동적 Z-index 계산: 중앙(diff=0)일수록 높은 값을 가짐 (완벽한 레이어 정렬)
                card.style.zIndex = Math.round(100 - diff);

                if (diff < minDiff) {
                    minDiff = diff;
                    closestCard = card;
                }
            });

            if (closestCard && !closestCard.classList.contains('focused')) {
                cards.forEach(c => c.classList.remove('focused'));
                closestCard.classList.add('focused');
                updateIndicatorColor(closestCard);
            }
        };

        // 초기 세팅
        cards.forEach((card, index) => {
            const angle = startOffset + (index * angleStep);
            card.style.setProperty('--angle', `${angle}deg`);
            card.dataset.angle = angle;
            
            if(card.classList.contains('focused')) {
                currentAngle = -angle;
                wheel.style.setProperty('--global-angle', `${currentAngle}deg`);
                updateIndicatorColor(card);
            }
        });
        
        // 처음 로드될 때 Z-index 및 포커스 정렬 한번 실행
        updateFocusDuringDrag();

        const startDrag = (e) => {
            isDragging = true;
            dragDistance = 0;
            startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
            startAngle = currentAngle;
            wheel.style.transition = 'none'; 
        };

        const moveDrag = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const x = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
            const dx = x - startX;
            dragDistance = Math.abs(dx);
            
            // ★ 드래그 민감도 대폭 축소 (0.25 -> 0.12)
            // 숫자가 작을수록 무겁고 뻑뻑하게 돌아감 (휙휙 넘어가는 현상 방지)
            currentAngle = startAngle + (dx * 0.12);
            
            const maxLimit = Math.abs(startOffset) + 15;
            if (currentAngle > maxLimit) currentAngle = maxLimit;
            if (currentAngle < -maxLimit) currentAngle = -maxLimit;
            
            wheel.style.setProperty('--global-angle', `${currentAngle}deg`);
            updateFocusDuringDrag();
        };

        const endDrag = () => {
            if (!isDragging) return;
            isDragging = false;
            wheel.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';

            if (dragDistance > 3) {
                snapToClosestCard();
            }
        };

        const snapToClosestCard = () => {
            const focusedCard = document.querySelector('.card.focused');
            if (focusedCard) {
                const targetAngle = -parseFloat(focusedCard.dataset.angle);
                currentAngle = targetAngle;
                wheel.style.setProperty('--global-angle', `${currentAngle}deg`);
                
                // 스냅되는 동안의 회전도 반영하기 위해 약간의 지연 후 레이어 재정렬
                setTimeout(updateFocusDuringDrag, 50);
            }
        };

        const jumpToCard = (card) => {
            const targetAngle = -parseFloat(card.dataset.angle);
            currentAngle = targetAngle;
            wheel.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
            wheel.style.setProperty('--global-angle', `${currentAngle}deg`);
            
            // 클릭으로 넘어갈 때도 Z-index 자연스럽게 업데이트
            updateFocusDuringDrag();
            updateIndicatorColor(card);
        };

        function updateIndicatorColor(card) {
            const glowColor = card.style.getPropertyValue('--c1-glow');
            if (glowColor) {
                indicator.style.background = glowColor.replace('0.5', '0.7'); 
            }
        }

        cards.forEach(card => {
            card.addEventListener('click', () => {
                if (dragDistance > 3) return;
                jumpToCard(card);
            });
        });

        container.addEventListener('mousedown', startDrag);
        container.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('touchmove', moveDrag, { passive: false });
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

    </script>
</body>
</html>
