<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      box-sizing: border-box;
    }
    .card{
      width: 280px;
      padding: 24px;
      border: 2px solid black;
      box-shadow: 6px 6px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
    }
    .avatar{
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: purple;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .role{
      letter-spacing: 1px;
      color: rgb(188, 157, 157);
      margin-top: -10px;
    }
    .stats{
      display: flex;
      gap: 30px;
      border-top: 1px rgb(234, 194, 194) solid;
      padding-top: 16px;
    }
    .stat{
      text-align: center;
    }
    .num{
      font-weight: 900;
      color: red;
      font-size: 24px;
    }
    .lbl{
      color: rgb(234, 194, 194);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">👩‍💻</div>
    <h3>Kim Coder</h3>
    <p class="role">FRONTEND DEV</p>
    <div class="stats">
      <div class="stat">
        <div class="num">128</div>
        <div class="lbl">Projects</div>
      </div>
      <div class="stat">
        <div class="num">4.9</div>
        <div class="lbl">Rating</div>
      </div>
      <div class="stat">
        <div class="num">5yr</div>
        <div class="lbl">Exp</div>
      </div>
    </div>
  </div>
</body>
</html>
