<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .linear-box{
      width: 300px;
      height: 200px;
      background: linear-gradient(to right, red, green);
    }
    .radial-box{
      width: 300px;
      height: 200px;
      background: radial-gradient(circle, blue, skyblue);
    }
  </style>
</head>
<body>
  <div class="linear-box"></div>
  <div class="radial-box"></div>
</body>
</html>
