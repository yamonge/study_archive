<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    div{
      width: 80%;
      display: flex;
      background: rgb(66, 49, 66);
      margin: 10px auto;
    }
    nav a{
      text-decoration: none;
    }
    ul > li{
      list-style: none;
      color: rgb(154, 159, 154);
      padding: 10px;
    }
    li:first-child{
      font-weight: bold;
      color: white;
    }
    ul{
      display: flex;
      gap: 20px;
    }
    li:hover{
      background: rgb(224, 55, 55);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <ul>
      <li>Home</li>
      <li>About</li>
      <li>Portfolio</li>
      <li>contact</li>
    </ul>
  </div>
</body>
</html>
