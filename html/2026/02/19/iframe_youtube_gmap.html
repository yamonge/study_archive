<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>예제 C - iframe 포털</title>
</head>
<body>
  <header>
    <h1 id="top">영상 학습 포털</h1>
    <p title="iframe으로 youtube 영상 및 구글 지도 넣기">
      오늘 목표: iframe으로 유튜브 영상을 페이지 안에 넣어보기<br>
      + iframe에 구글 지도 띄우기<br>
      nav 메뉴로 섹션 이동(앵커)
    </p>
    <hr>
  </header>

  <nav>
    <p title="nav는 메뉴(이동 링크 모음)입니다.">메뉴</p>
    <ul>
      <li><a href="#intro" title="소개로 이동">소개</a></li>
      <li><a href="#video" title="영상으로 이동">영상</a></li>
      <li><a href="#gmap" title="">지도</a></li>
    </ul>
    <hr>
  </nav>

  <main>
    <section id="intro">
      <h2>소개</h2>
      <p>
        iframe은 페이지 안에 “창틀”을 만들어서<br>
        다른 콘텐츠(유튜브, 지도 등)를 끼워 넣는 태그입니다.
      </p>
      <p><a href="#top">맨 위로</a></p>
      <hr>
    </section>

    <!-- 아래의 영상들은 본인이 좋아하는 영상들에서 공유-퍼가기를 해도 되고
      제가 작성한 양식 처럼 작성해도 됩니다.-->
    <section id="video">
      <h2>영상</h2>
    
      <iframe
        name="player"
        width="560"
        height="315"
        src="https://www.youtube.com/embed/Ra9-pYiw-uU"
        title="유튜브 영상 1"
        allowfullscreen>
      </iframe>

      <p title="target=player는 iframe name=player로 열겠다는 뜻">
       아래 링크를 누르면 같은 창(iframe)에서 영상이 바뀝니다.
      </p>

      <!-- 같은 iframe(name=player)에서 영상이 바뀌도록 target 지정 -->
      <ul>
        <li>
          <a href="https://www.youtube.com/embed/uVpGElT--E8"
             target="player"
             title="같은 iframe에서 다른 영상으로 교체">
            다른 영상으로 바꾸기 1
          </a>
        </li>
        <li>
          <a href="https://www.youtube.com/embed/UVjJR7pDRvA"
             target="player"
             title="같은 iframe에서 다른 영상으로 교체">
            다른 영상으로 바꾸기 2
          </a>
        </li>
      </ul>

      <p><a href="#top">맨 위로</a></p>
      <hr>
    </section>

    <!--지도는 구글 map 기준으로 공유하고자 하는 위치를 우클릭 한 후 
     이 위치 공유 그 다음 지도 퍼가기 탭에서 html 복사를 실행 -->
    <section id="gmap">
      <h2>지도 </h2>
      <iframe src="https://www.google.com/maps/embed?pb=!1m21!1m12!1m3!1d1507.5870717019202!2d127.14671603718348!3d36.807359360521744!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m6!3e6!4m0!4m3!3m2!1d36.80730463173651!2d127.14723249745855!5e0!3m2!1sko!2skr!4v1771473156920!5m2!1sko!2skr" 
      width="600" height="450" style="border:0;" allowfullscreen="" 
      loading="lazy" referrerpolicy="no-referrer-when-downgrade">
      </iframe>


      <p><a href="#top">맨 위로</a></p>
    </section>
  </main>

  <footer>
    <hr>
    <p>© 2026 iframe 실습</p>
  </footer>
</body>
</html>
