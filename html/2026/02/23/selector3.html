<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 구조적 가상 클래스 선택자 : 요소의 구조와 위치에 따라스타일을 적용하는 방식 */
    li:first-child{
      color: red;
    }
    li:last-child{
      color: blueviolet;
    }
    li{
      list-style: none;
    }
    li:nth-child(3){
      color: rgb(224, 224, 68);
    }
  </style>
</head>
<body>
  <ul>
    <li>사과</li>
    <li>바나나</li>
    <li>배</li>
    <li>키위</li>
    <li>수박</li>
    <li>멜론</li>
    <li>토마토</li>
  </ul>
</body>
</html>
