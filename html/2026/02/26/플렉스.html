<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .flexbox{
      width: 480px;
      height: 200px;
      background-color: aqua;
      border: 1px black solid;
      display: flex;
      flex-wrap: wrap;
      flex-direction: row;
      justify-content: center;
      padding: 2px;
      gap: 2px;
    }
    .flex-item{
      width: 80px;
      height: 50px;
      margin: 2px;
      border: 1px black solid;
      color: white;
      background-color: orange;
    }
  </style>
</head>
<body>
  <div class="flexbox">
    <div class="flex-item">item1</div>
    <div class="flex-item">item2</div>
    <div class="flex-item">item3</div>
    <div class="flex-item">item4</div>
    <div class="flex-item">item5</div>
    <div class="flex-item">item6</div>
    <div class="flex-item">item7</div>
    <div class="flex-item">item8</div>
    <div class="flex-item">item9</div>
    <div class="flex-item">item10</div>    
  </div>
</body>
</html>
