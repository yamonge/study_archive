  <h1>index2: 목록(ul/ol)</h1>
  <p>ul은 순서 없는 목록, ol은 순서 있는 목록입니다.</p>
  <hr>
  <h2>ul (순서 없음)</h2>
  <ul>
    <li>사과</li>
    <li>바나나</li>
    <li>딸기</li>
  </ul>
  <h2>ol (순서 있음)</h2>
  <ol>
    <li>준비한다</li>
    <li>시작한다</li>
    <li>마무리한다</li>
  </ol>
