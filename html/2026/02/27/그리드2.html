<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_paste,dock_to_left,page_footer,page_header" />
  <title>Document</title>
  <style>
    *{
      margin: 0;
    }
    .grid-container{
      display: grid;
      width: 700px;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 150px);
      grid-template-areas: 
        "header header header"
        "sidebar content content"
        "footer footer footer"
      ;
      gap: 10px;
      margin: 50px auto;
    }
    #header{
      grid-area: header;
      background-color: orangered;
    }
    #sidebar{
      grid-row: sidebar;
      background-color: aqua;
    }
    #content{
      grid-area: content;
      background-color: orange;
    }
    #footer{
      grid-area: footer;
      background-color: violet;
    }
    .item{
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <p id="header" class="item">
      <span class="material-symbols-outlined">page_header</span>
      <span>header</span>
    </p>
    <p id="sidebar" class="item">
      <span class="material-symbols-outlined">dock_to_left</span>
      <span>sidebar</span>
    </p>
    <p id="content" class="item">
      <span class="material-symbols-outlined">content_paste</span>
      <span>content</span>
    </p>
    <p id="footer" class="item">
      <span class="material-symbols-outlined">page_footer</span>
      <span>footer</span>
    </p>
  </div>
</body>
</html>
