<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=grid_3x3" />
  <style>
    .grid-container{
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      background-color: yellow;
    }
    .item{
      height: 150px;
      background-color: orange;
      border-radius: 10px;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .item:nth-child(2n){
      background-color: orangered;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="item">
      <span class="material-symbols-outlined">grid_3x3</span>
      <span>박스1</span>
    </div>
    <div class="item">
      <span class="material-symbols-outlined">grid_3x3</span>
      <span>박스2</span>
    </div>
    <div class="item">
      <span class="material-symbols-outlined">grid_3x3</span>
      <span>박스3</span>
    </div>
    <div class="item">
      <span class="material-symbols-outlined">grid_3x3</span>
      <span>박스4</span>
    </div>            
    <div class="item">
      <span class="material-symbols-outlined">grid_3x3</span>
      <span>박스5</span>
    </div>    
  </div>
</body>
</html>
