spring.application.name=mes_final_260106
spring.config.import=optional:file:.env[.properties]

# 1. Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/mes_hm_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 개선: 비밀번호 하드코딩 대신 환경변수 사용 (없으면 changeme로 대체)
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA Configuration
# 개선: create -> update (재시작할 때마다 테이블이 날아가지 않도록)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 3. Server Port
server.port=8111