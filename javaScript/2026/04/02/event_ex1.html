<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실습1</title>
  <style>
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    .container{
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
      gap: 40px;
    }
    .btn_container{
      display: flex;
      gap: 20px;
    }
    .btn{
      border: none;
      padding: 15px 60px;
      border-radius: 5px;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }
    .btn:nth-child(1){
      background-color: green;
    }
    .btn:nth-child(2){
      background-color: orange;
    }
    .btn:nth-child(3){
      background-color: purple;
    }
    .showbox{
      border: 2px solid #ccc;
      width: 580px;
      height: 400px;
      border-radius: 15px;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="btn_container">
      <button class="btn">Green</button>
      <button class="btn">Orange</button>
      <button class="btn">Purple</button>
    </div>
    <div class="showbox">

    </div>
  </div>
  <script>
    const btns = document.querySelectorAll(".btn");
    const box1 = document.querySelector(".showbox");
    
    btns.forEach(btn => {
      btn.addEventListener("click", (e) => {
        if(e.target.textContent === "Green"){
          box1.style = "background: green";
        }else if(e.target.textContent === "Orange"){
          box1.style = "background: orange";
        }else{
          box1.style = "background: purple";
        }
        alert(e.target.textContent);
      })
    })
  </script>
</body>
</html>
