<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1 id="title">문서 제목 입니다.</h1>
  <p class="text">첫번째 단락</p>
  <p class="text">두번째 단락</p>
  <div class="box1"></div>
  <div class="box1"></div>
  <div class="box1"></div>
  <p>세번째 단락락</p>
  <script>

    console.log(doc)

    console.log(boxEl)
