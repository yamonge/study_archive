<!-- Interactive background light follow effect -->
<script>
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.floating-bg');
            const x = e.clientX;
            const y = e.clientY;
            
            // Move subtle background lights slightly based on mouse
            const xMove = (x - window.innerWidth / 2) / 20;
            const yMove = (y - window.innerHeight / 2) / 20;
            
            document.querySelectorAll('.floating-bg').forEach((bg, index) => {
                const multiplier = index === 0 ? 1 : -1;
                bg.style.transform = `translate(${xMove * multiplier}px, ${yMove * multiplier}px)`;
            });
        });

        // Simple input focus effects
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });
    </script>
