<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>답안지2-1</title>
  <style>
    *{
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }
    body{
      background-color: rgb(46, 37, 37);
    }
    .container{
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5%;
    }
    a{
      text-decoration: none;
    }
    .menu_box{
      width: 100%;
      display: flex;
      justify-items: center;
    }
    .menu_box a{
      text-align: center;
      width: 50%;
      padding: 30px; 
      background-color: rgb(85, 80, 80);
      color: white;
      font-size: 25px;
    }
    .menu_box a:nth-child(2){
      background-color: rgb(197, 145, 49);
    }
    p{
      color: white;
      text-align: center;
      font-size: 50px;
      font-weight: lighter;
    }
    .input_box{
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 50px;
    }
    .input_box input{
      background: none;
      border: 1px white solid;
      padding: 15px 10px;
      font-size: 20px;
      color: white;
    }
    .login_input{
      background-color: rgb(197, 145, 49);
      border: none;
      color: white;
      padding: 10px;
      font-size: 60px;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      cursor: pointer;
    }
    form{
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 50px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="menu_box">
      <a href="./답안지2-2.html">Sign Up</a>
      <a href="./답안지2-1.html">Log In</a>
    </div>
    <p>Welcome Back!</p>
    <form>
      <div class="input_box">
        <input type="email" placeholder="Email Address*">
        <input type="password" placeholder="Password*">
      </div>
      <input class="login_input" type="submit" value="LOG IN">
    </form>
  </div>
</body>
</html>
