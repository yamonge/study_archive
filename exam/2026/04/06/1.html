<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', 'Noto Sans KR', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border: 0.5px solid #878787;
      border-radius: 10px;
      box-shadow: 0 4px 64px rgba(0, 0, 0, 0.05);
      width: 505px;
      padding: 50px 40px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #010101;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 20px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 31px;
      font-weight: 500;
      color: #000;
      margin-bottom: 22px;
    }

    .form-area {
      width: 423px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }

    .field {
      width: 423px;
    }

    .field label {
      display: block;
      font-size: 16px;
      font-weight: 400;
      color: #000;
      margin-bottom: 8px;
    }

    .field label .required {
      color: red;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 0.6px solid #282828;
      border-radius: 6px;
      background: #fff;
      font-family: 'Poppins', 'Noto Sans KR', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: #000;
      padding: 16px 27px;
      outline: none;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #ababab;
    }

    .field textarea {
      height: 100px;
      resize: vertical;
    }

    .agree-row {
      width: 423px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .agree-row input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 15px;
      border: 1px solid #000;
      background: #fff;
      cursor: pointer;
      flex-shrink: 0;
    }

    .agree-row input[type="checkbox"]:checked {
      background: #010101;
    }

    .agree-row label {
      font-size: 12px;
      font-weight: 300;
      color: #000;
      cursor: pointer;
    }

    .btn-row {
      width: 422px;
      display: flex;
      justify-content: space-between;
    }

    .btn {
      width: 180px;
      padding: 16px 0;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', 'Noto Sans KR', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
    }

    .btn-submit {
      background: #010101;
    }

    .btn-cancel {
      background: #a09a9a;
    }

    .login-link {
      margin-top: 22px;
      font-size: 16px;
      font-weight: 300;
      color: #7d7d7d;
    }

    .login-link a {
      color: #000;
      font-weight: 600;
      text-decoration: none;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">S</div>
    <h1 class="title">회원가입</h1>

    <form class="form-area" action="#" method="post">
      <div class="field">
        <label>아이디<span class="required">*</span></label>
        <input type="text" placeholder="아이디를 입력해주세요.">
      </div>

      <div class="field">
        <label>닉네임<span class="required">*</span></label>
        <input type="text" placeholder="닉네임을 입력해주세요">
      </div>

      <div class="field">
        <label>비밀번호<span class="required">*</span></label>
        <input type="password" placeholder="비밀번호를 입력해주세요.">
      </div>

      <div class="field">
        <label>비밀번호 확인<span class="required">*</span></label>
        <input type="password" placeholder="비밀번호를 입력해주세요.">
      </div>

      <div class="field">
        <label>가입 목적</label>
        <textarea placeholder="가입 목적을 입력해주세요."></textarea>
      </div>

      <div class="agree-row">
        <input type="checkbox" id="agree">
        <label for="agree">정보 제공 동의</label>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn btn-submit">회원가입</button>
        <button type="button" class="btn btn-cancel">가입 취소</button>
      </div>
    </form>

    <p class="login-link">이미 회원가입을 하셨나요 ?<a href="#">로그인</a></p>
  </div>
</body>
</html>
